<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批次管理 - 标注工作台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- 导航栏 -->
    <nav class="nav-bar">
      <a href="/" class="nav-link">时长监控</a>
      <a href="/batches.html" class="nav-link active">批次管理</a>
    </nav>

    <!-- 头部 -->
    <header class="header">
      <div class="header-left">
        <h1>批次管理</h1>
        <span class="subtitle">数据来源：data-platform.synapath.com</span>
      </div>
      <div class="header-right">
        <span id="user-info" class="user-info" style="display:none;"></span>
        <span id="last-update" class="last-update">加载中...</span>
        <button id="refresh-btn" class="btn btn-sm" onclick="loadBatches()">刷新</button>
        <button id="logout-btn" class="btn btn-sm logout-btn" onclick="logout()">退出</button>
      </div>
    </header>

    <!-- 控制栏 -->
    <div class="controls">
      <select class="filter-select" id="status-filter" onchange="loadBatches()">
        <option value="">全部状态</option>
        <option value="pending">待审核</option>
        <option value="reviewing">审核中</option>
        <option value="passed">已通过</option>
        <option value="rejected">已驳回</option>
      </select>
      <select class="filter-select" id="project-filter" onchange="loadBatches()">
        <option value="">全部项目</option>
      </select>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索批次ID / 标注员..." oninput="handleBatchSearch()">
      </div>
      <button class="btn btn-sm" style="background: var(--primary); border: none;" onclick="loadBatches()">查询</button>
    </div>

    <!-- 批次表格 -->
    <div class="chart-container">
      <div class="chart-header">
        <h2 id="batch-title">批次管理</h2>
        <div style="display: flex; gap: 8px; align-items: center;">
          <span id="batch-count" style="font-size: 13px; color: var(--text-muted);"></span>
          <button class="btn btn-sm export-btn" onclick="exportBatchCSV()">导出CSV</button>
        </div>
      </div>
      <div id="batch-area" class="batch-area">
        <div class="chart-loading">
          <div class="spinner"></div>
          <div>加载中...</div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>标注工作台 v2.0 | 批次管理 | 数据从平台直接获取</p>
    </footer>
  </div>

  <script>
    let allBatchData = [];
    let currentBatchSearch = '';
    let searchDebounceTimer = null;

    // ========== 认证 ==========
    function getAuthToken() { return localStorage.getItem('auth_token') || ''; }
    function getAuthUsername() { return localStorage.getItem('auth_username') || ''; }

    async function checkAuth() {
      const token = getAuthToken();
      if (!token) { window.location.href = '/login.html'; return false; }
      try {
        const resp = await fetch('/api/check-auth', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await resp.json();
        if (!data.authenticated) {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('auth_username');
          window.location.href = '/login.html';
          return false;
        }
        const userInfo = document.getElementById('user-info');
        if (userInfo) {
          userInfo.textContent = getAuthUsername() || data.username || '';
          userInfo.style.display = 'inline-block';
        }
        return true;
      } catch {
        window.location.href = '/login.html';
        return false;
      }
    }

    async function logout() {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('auth_username');
      try { await fetch('/api/logout', { method: 'POST' }); } catch {}
      window.location.href = '/login.html';
    }

    async function fetchAPI(url) {
      const token = getAuthToken();
      const response = await fetch(url, {
        headers: token ? { 'Authorization': 'Bearer ' + token } : {}
      });
      if (response.status === 401) {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('auth_username');
        window.location.href = '/login.html';
        throw new Error('登录已过期');
      }
      if (!response.ok) throw new Error(`API错误: ${response.status}`);
      return response.json();
    }

    // ========== 数据加载 ==========
    async function loadBatches() {
      const batchArea = document.getElementById('batch-area');
      batchArea.innerHTML = '<div class="chart-loading"><div class="spinner"></div><div>加载中...</div></div>';

      try {
        let url = '/api/batches?limit=200';
        const statusFilter = document.getElementById('status-filter').value;
        if (statusFilter) url += `&status=${statusFilter}`;
        if (currentBatchSearch) url += `&annotator=${encodeURIComponent(currentBatchSearch)}`;

        const data = await fetchAPI(url);

        // 解析返回数据，兼容多种格式
        let batches = [];
        if (Array.isArray(data)) {
          batches = data;
        } else if (data.batches) {
          batches = data.batches;
        } else if (data.items) {
          batches = data.items;
        } else if (data.data) {
          batches = Array.isArray(data.data) ? data.data : (data.data.batches || data.data.items || []);
        } else if (data.results) {
          batches = data.results;
        }

        allBatchData = batches;

        // 更新标题和计数
        document.getElementById('batch-title').textContent = '批次管理';
        document.getElementById('batch-count').textContent = `共 ${batches.length} 条记录`;

        // 更新项目筛选器
        updateProjectFilter(batches);

        renderBatches();
        document.getElementById('last-update').textContent = `最后更新: ${new Date().toLocaleTimeString('zh-CN')}`;
      } catch (error) {
        batchArea.innerHTML = `<div class="batch-empty"><div class="batch-empty-icon">!</div><div>加载失败: ${error.message}</div></div>`;
      }
    }

    function updateProjectFilter(batches) {
      const select = document.getElementById('project-filter');
      const currentValue = select.value;
      const projects = new Set();
      for (const b of batches) {
        const proj = getField(b, ['label_project', 'label_project_name', 'project_name', 'projectName', 'project']);
        if (proj) projects.add(proj);
      }
      select.innerHTML = '<option value="">全部项目</option>';
      for (const proj of [...projects].sort()) {
        select.innerHTML += `<option value="${proj}">${proj}</option>`;
      }
      select.value = currentValue;
    }

    // ========== 渲染 ==========
    function getField(obj, possibleKeys) {
      for (const key of possibleKeys) {
        if (obj[key] !== undefined && obj[key] !== null && obj[key] !== '') {
          return obj[key];
        }
      }
      return '-';
    }

    function getStatusInfo(status) {
      const s = (status || '').toString().toLowerCase();
      if (s.includes('pending') || s.includes('待') || s.includes('wait') || s.includes('submit')) {
        return { class: 'batch-status-pending', label: '待审核' };
      }
      if (s.includes('review') || s.includes('审核中') || s.includes('progress') || s.includes('ongoing')) {
        return { class: 'batch-status-reviewing', label: '审核中' };
      }
      if (s.includes('pass') || s.includes('通过') || s.includes('approve') || s.includes('accept') || s.includes('done') || s.includes('complete')) {
        return { class: 'batch-status-passed', label: '已通过' };
      }
      if (s.includes('reject') || s.includes('驳回') || s.includes('fail') || s.includes('deny') || s.includes('return')) {
        return { class: 'batch-status-rejected', label: '已驳回' };
      }
      return { class: 'batch-status-default', label: status || '-' };
    }

    function getResultBadge(result) {
      const r = (result || '').toString().toLowerCase();
      if (r.includes('pass') || r.includes('通过') || r.includes('approve')) {
        return '<span style="color: #15803d; font-weight: 600;">通过</span>';
      }
      if (r.includes('reject') || r.includes('驳回') || r.includes('fail')) {
        return '<span style="color: #b91c1c; font-weight: 600;">驳回</span>';
      }
      if (r.includes('pending') || r.includes('待')) {
        return '<span style="color: #b45309; font-weight: 600;">待处理</span>';
      }
      return result || '-';
    }

    function formatDate(dateStr) {
      if (!dateStr || dateStr === '-') return '-';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleString('zh-CN', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit'
        });
      } catch {
        return dateStr;
      }
    }

    function renderBatches() {
      const batchArea = document.getElementById('batch-area');
      const projectFilter = document.getElementById('project-filter').value;

      let filtered = allBatchData;

      // 项目筛选
      if (projectFilter) {
        filtered = filtered.filter(b => {
          const proj = getField(b, ['label_project', 'label_project_name', 'project_name', 'projectName', 'project']);
          return proj === projectFilter;
        });
      }

      if (filtered.length === 0) {
        batchArea.innerHTML = `
          <div class="batch-empty">
            <div class="batch-empty-icon">-</div>
            <div>暂无批次数据</div>
          </div>
        `;
        return;
      }

      let html = '<div class="batch-table-wrapper"><table class="batch-table">';
      html += `
        <thead>
          <tr>
            <th>批次ID</th>
            <th>标注项目</th>
            <th>供应商</th>
            <th>任务组合</th>
            <th>状态</th>
            <th>审核结果</th>
            <th>实际审核人</th>
            <th>标注员</th>
            <th>轮次</th>
            <th>结果</th>
            <th>创建时间</th>
          </tr>
        </thead>
        <tbody>
      `;

      for (const b of filtered) {
        const batchId = getField(b, ['batch_id', 'batchId', 'id', 'batch_no', 'batchNo']);
        const labelProject = getField(b, ['label_project', 'label_project_name', 'project_name', 'projectName', 'project']);
        const supplier = getField(b, ['organization', 'org', 'supplier', 'vendor', 'organization_name', 'org_name']);
        const taskGroup = getField(b, ['task_group', 'taskGroup', 'task_group_name', 'taskGroupName', 'task_set', 'taskSet']);
        const status = getField(b, ['status', 'batch_status', 'batchStatus', 'state']);
        const reviewResult = getField(b, ['review_result', 'reviewResult', 'audit_result', 'auditResult']);
        const reviewer = getField(b, ['reviewer', 'actual_reviewer', 'actualReviewer', 'reviewer_name', 'auditor', 'reviewer_name', 'auditor_name']);
        const annotator = getField(b, ['annotator', 'annotator_label', 'annotator_name', 'annotatorName', 'labeler']);
        const round = getField(b, ['round', 'batch_round', 'batchRound', 'round_number', 'roundNumber']);
        const result = getField(b, ['result', 'review_result_detail', 'reviewResultDetail', 'final_result', 'finalResult']);
        const createdAt = getField(b, ['created_at', 'createdAt', 'created_time', 'createdTime', 'create_time', 'createTime']);

        const statusInfo = getStatusInfo(status);

        html += `
          <tr>
            <td class="batch-id-cell">${batchId}</td>
            <td>${labelProject}</td>
            <td>${supplier}</td>
            <td>${taskGroup}</td>
            <td><span class="batch-status ${statusInfo.class}">${statusInfo.label}</span></td>
            <td>${getResultBadge(reviewResult)}</td>
            <td>${reviewer}</td>
            <td>${annotator}</td>
            <td>${round}</td>
            <td>${getResultBadge(result)}</td>
            <td style="white-space: nowrap; color: var(--text-muted); font-size: 12px;">${formatDate(createdAt)}</td>
          </tr>
        `;
      }

      html += '</tbody></table></div>';
      batchArea.innerHTML = html;
      document.getElementById('batch-count').textContent = `共 ${filtered.length} 条记录`;
    }

    // ========== 交互 ==========
    function handleBatchSearch() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        currentBatchSearch = document.getElementById('search-input').value.trim();
        loadBatches();
      }, 300);
    }

    function exportBatchCSV() {
      if (allBatchData.length === 0) { alert('暂无数据可导出'); return; }

      const headers = ['批次ID', '标注项目', '供应商', '任务组合', '状态', '审核结果', '实际审核人', '标注员', '轮次', '结果', '创建时间'];

      const rows = allBatchData.map(b => {
        const batchId = getField(b, ['batch_id', 'batchId', 'id', 'batch_no', 'batchNo']);
        const labelProject = getField(b, ['label_project', 'label_project_name', 'project_name', 'projectName', 'project']);
        const supplier = getField(b, ['organization', 'org', 'supplier', 'vendor', 'organization_name', 'org_name']);
        const taskGroup = getField(b, ['task_group', 'taskGroup', 'task_group_name', 'taskGroupName', 'task_set', 'taskSet']);
        const status = getField(b, ['status', 'batch_status', 'batchStatus', 'state']);
        const reviewResult = getField(b, ['review_result', 'reviewResult', 'audit_result', 'auditResult']);
        const reviewer = getField(b, ['reviewer', 'actual_reviewer', 'actualReviewer', 'reviewer_name', 'auditor']);
        const annotator = getField(b, ['annotator', 'annotator_label', 'annotator_name', 'annotatorName', 'labeler']);
        const round = getField(b, ['round', 'batch_round', 'batchRound', 'round_number', 'roundNumber']);
        const result = getField(b, ['result', 'review_result_detail', 'reviewResultDetail', 'final_result', 'finalResult']);
        const createdAt = getField(b, ['created_at', 'createdAt', 'created_time', 'createdTime', 'create_time', 'createTime']);

        return [batchId, labelProject, supplier, taskGroup, status, reviewResult, reviewer, annotator, round, result, formatDate(createdAt)]
          .map(v => `"${(v || '').toString().replace(/"/g, '""')}"`).join(',');
      });

      const csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `批次管理_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    // ========== 初始化 ==========
    window.addEventListener('DOMContentLoaded', async () => {
      const authed = await checkAuth();
      if (!authed) return;
      loadBatches();
    });
  </script>
</body>
</html>

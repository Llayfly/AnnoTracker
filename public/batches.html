<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>批次管理 - 标注员工作统计监控</title>
  <link rel="stylesheet" href="style.css?v=20260904" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>批次管理</h1>
      <span class="sub">标注员批次申请记录 · 审核状态跟踪</span>
    </div>
    <div class="status" id="statusBar">
      <span class="user-badge" id="userBadge"></span>
      <button class="logout-btn" id="logoutBtn">登出</button>
    </div>
  </header>

  <main class="container">
    <!-- 导航 -->
    <nav class="main-nav">
      <div class="nav-item-parent active">
        <span class="nav-parent">统计监控</span>
        <div class="nav-children">
          <a href="/" class="nav-child">时长监控</a>
          <a href="/batches" class="nav-child active">批次管理</a>
        </div>
      </div>
    </nav>

    <!-- 顶部操作栏 -->
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
      <button class="btn-add" id="autoCollectBtn" style="background:#1565c0;padding:10px 24px;font-size:14px;">
        从平台自动采集批次
      </button>
      <button class="add-toggle" id="toggleAddForm">＋ 手动添加</button>
      <span id="collectStatus" style="font-size:13px;color:#666;"></span>
      <span style="flex:1"></span>
      <span style="font-size:12px;color:#999;">手动添加的记录不会被自动采集覆盖</span>
    </div>

    <!-- 手动添加表单（默认折叠） -->
    <section class="panel" id="addFormPanel" style="display:none;margin-bottom:16px;">
      <div class="batch-add-form" style="padding:16px;">
        <div>
          <label class="f-label">标注员 *</label><br />
          <input type="text" id="f_annotator" placeholder="如 HC3" style="width:100px;" />
        </div>
        <div>
          <label class="f-label">项目类型</label><br />
          <select id="f_project">
            <option value="">--选择--</option>
            <option>零售服务类标注</option>
            <option>餐饮接待类标注</option>
            <option>定制操作类标注</option>
            <option>生产制造类标注</option>
            <option>仓配物流类标注</option>
            <option>家庭服务类标注</option>
            <option>住宿服务类标注</option>
          </select>
        </div>
        <div>
          <label class="f-label">任务组合（选填）</label><br />
          <input type="text" id="f_task_combination" placeholder="如 生产制造类/包装车间/混合任务" style="width:230px;" />
        </div>
        <div>
          <label class="f-label">批次ID</label><br />
          <input type="text" id="f_batch_id" placeholder="如 17555" style="width:90px;" />
        </div>
        <div>
          <label class="f-label">状态</label><br />
          <select id="f_status">
            <option value="已分发">已分发</option>
            <option value="待审核">待审核</option>
            <option value="预审核通过">预审核通过</option>
            <option value="通过">通过</option>
            <option value="需修改">需修改</option>
            <option value="已废弃">已废弃</option>
          </select>
        </div>
        <div>
          <label class="f-label">审核结果</label><br />
          <select id="f_review_result">
            <option value="">无</option>
            <option value="通过">通过</option>
            <option value="需修改">需修改</option>
          </select>
        </div>
        <div>
          <label class="f-label">审核人</label><br />
          <input type="text" id="f_reviewer" placeholder="如 SH26" style="width:80px;" />
        </div>
        <div>
          <label class="f-label">轮次</label><br />
          <input type="number" id="f_round" value="0" min="0" style="width:60px;" />
        </div>
        <div>
          <label class="f-label">进度 当前/总数</label><br />
          <input type="number" id="f_progress_current" value="0" min="0" style="width:60px;" />
          <input type="number" id="f_progress_total" value="0" min="0" style="width:60px;" />
        </div>
        <div>
          <label class="f-label">日期 *</label><br />
          <input type="date" id="f_date" style="width:130px;" />
        </div>
        <div>
          <label class="f-label">备注</label><br />
          <input type="text" id="f_note" placeholder="可选" style="width:140px;" />
        </div>
        <div style="display:flex;align-items:flex-end;gap:8px;">
          <button class="btn-add" id="addBatchBtn">添加批次</button>
          <button class="op-btn" id="cancelAddBtn">收起</button>
        </div>
      </div>
    </section>

    <!-- 筛选 -->
    <section class="panel batch-filters" style="padding:12px 16px;margin-bottom:16px;">
      <label class="f-label">状态</label>
      <select id="filterStatus">
        <option value="">全部状态</option>
        <option value="已分发">已分发</option>
        <option value="待审核">待审核</option>
        <option value="预审核通过">预审核通过</option>
        <option value="通过">通过</option>
        <option value="需修改">需修改</option>
        <option value="已废弃">已废弃</option>
      </select>
      <label class="f-label">项目</label>
      <select id="filterProject"><option value="">全部项目</option></select>
      <input type="text" id="filterKeyword" placeholder="搜索批次ID / 标注员 / 任务组合..." style="width:230px;" />
      <button class="btn-secondary" id="filterBtn">查询</button>
      <button class="op-btn" id="clearFilterBtn">重置</button>
    </section>

    <!-- 统计卡 -->
    <div class="batch-stats" id="statsBar"></div>

    <!-- 表格 -->
    <section class="panel">
      <div class="panel-head">
        <h2>批次列表 <span id="resultCount" class="muted"></span></h2>
      </div>
      <div class="batch-table-wrap">
        <table class="batch-table" style="width:100%;table-layout:fixed;border-collapse:collapse;">
          <thead>
            <tr>
              <th style="width:70px;">批次ID</th>
              <th style="width:140px;">标注项目</th>
              <th style="width:180px;">任务组合</th>
              <th style="width:100px;">状态</th>
              <th style="width:90px;">审核结果</th>
              <th style="width:92px;">实际审核人</th>
              <th style="width:78px;">标注员</th>
              <th style="width:56px;" class="num">轮次</th>
              <th style="width:150px;">创建时间</th>
              <th style="width:110px;" class="center">操作</th>
            </tr>
          </thead>
          <tbody id="batchBody"></tbody>
        </table>
      </div>
      <div class="batch-pager" id="pager"></div>
    </section>
  </main>

  <!-- 编辑弹窗 -->
  <div class="modal" id="editModal">
    <div class="modal-content" style="max-width: 620px;">
      <div class="modal-head">
        <h2>编辑批次</h2>
        <button class="close" id="closeEdit">&times;</button>
      </div>
      <div class="batch-add-form" style="padding:16px 0;">
        <input type="hidden" id="e_id" />
        <div>
          <label class="f-label">批次ID</label><br />
          <input type="text" id="e_batch_id" style="width:100px;" />
        </div>
        <div>
          <label class="f-label">标注员</label><br />
          <input type="text" id="e_annotator" style="width:100px;" />
        </div>
        <div>
          <label class="f-label">项目类型</label><br />
          <select id="e_project">
            <option value="">--选择--</option>
            <option>零售服务类标注</option>
            <option>餐饮接待类标注</option>
            <option>定制操作类标注</option>
            <option>生产制造类标注</option>
            <option>仓配物流类标注</option>
            <option>家庭服务类标注</option>
            <option>住宿服务类标注</option>
          </select>
        </div>
        <div style="flex:1;min-width:240px;">
          <label class="f-label">任务组合</label><br />
          <input type="text" id="e_task_combination" style="width:100%;" />
        </div>
        <div>
          <label class="f-label">状态</label><br />
          <select id="e_status">
            <option value="已分发">已分发</option>
            <option value="待审核">待审核</option>
            <option value="预审核通过">预审核通过</option>
            <option value="通过">通过</option>
            <option value="需修改">需修改</option>
            <option value="已废弃">已废弃</option>
          </select>
        </div>
        <div>
          <label class="f-label">审核结果</label><br />
          <select id="e_review_result">
            <option value="">无</option>
            <option value="通过">通过</option>
            <option value="需修改">需修改</option>
          </select>
        </div>
        <div>
          <label class="f-label">审核人</label><br />
          <input type="text" id="e_reviewer" style="width:80px;" />
        </div>
        <div>
          <label class="f-label">轮次</label><br />
          <input type="number" id="e_round" min="0" style="width:60px;" />
        </div>
        <div>
          <label class="f-label">进度 当前/总数</label><br />
          <input type="number" id="e_progress_current" min="0" style="width:60px;" />
          <input type="number" id="e_progress_total" min="0" style="width:60px;" />
        </div>
        <div>
          <label class="f-label">日期</label><br />
          <input type="date" id="e_date" style="width:130px;" />
        </div>
        <div style="flex:1;min-width:240px;">
          <label class="f-label">备注</label><br />
          <input type="text" id="e_note" style="width:100%;" />
        </div>
        <div style="display:flex;align-items:flex-end;gap:8px;width:100%;">
          <button class="btn-add" id="saveEditBtn">保存修改</button>
          <span id="editResult" style="font-size:12px;color:#666;"></span>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <span id="footStatus"></span>
  </footer>

  <script src="batches.js?v=20260904"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 标注员工作统计监控</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>标注员工作统计监控</h1>
      <p>请登录后查看数据</p>
    </div>
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="显示密码" title="显示密码">
            <svg id="pwEyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="pwEyeClosed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
    </form>
  </div>

  <script>
    'use strict';
    // 到达登录页时，清除任何旧的 token，避免无效 token 导致重定向死循环
    localStorage.removeItem('am_token');
    localStorage.removeItem('am_user');

    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    // 密码可视化：点击切换显示/隐藏
    const pwInput = document.getElementById('password');
    const pwToggle = document.getElementById('pwToggle');
    const eyeOpen = document.getElementById('pwEyeOpen');
    const eyeClosed = document.getElementById('pwEyeClosed');
    pwToggle.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      eyeOpen.style.display = show ? 'none' : '';
      eyeClosed.style.display = show ? '' : 'none';
      pwToggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      pwToggle.setAttribute('title', show ? '隐藏密码' : '显示密码');
      pwInput.focus();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.textContent = '';
      btn.disabled = true;
      btn.textContent = '登录中...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const json = await res.json();
        if (!res.ok) {
          throw new Error(json.error || '登录失败');
        }
        // 保存 token 并跳转
        localStorage.setItem('am_token', json.token);
        localStorage.setItem('am_user', json.username);
        window.location.href = '/';
      } catch (err) {
        errBox.textContent = err.message;
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>

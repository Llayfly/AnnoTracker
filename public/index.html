<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>标注员工作统计监控</title>
  <link rel="stylesheet" href="style.css?v=20260810" />
  <style>
    .group-section { margin-bottom: 24px; }
    .group-title { font-size: 16px; font-weight: 700; margin: 16px 0 8px; padding: 8px 12px; border-radius: 6px; }
    .group-hc { background: #e3f2fd; color: #1565c0; }
    .group-c { background: #fce4ec; color: #c62828; }
    .group-s { background: #f3e5f5; color: #6a1b9a; }
    .group-other { background: #f5f5f5; color: #616161; }
    .rank-cell { font-weight: 700; color: #666; text-align: center; }
    .rank-1 { color: #d4a017; }
    .rank-2 { color: #8a8a8a; }
    .rank-3 { color: #b87333; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>标注员工作统计监控</h1>
      <span class="sub">数据来源：data-platform.synapath.com · 组织 HC</span>
    </div>
    <div class="status" id="statusBar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">加载中...</span>
      <span class="user-badge" id="userBadge"></span>
      <button class="logout-btn" id="logoutBtn">登出</button>
    </div>
  </header>

  <main class="container">
    <!-- 导航 -->
    <div class="nav-tabs" style="display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid #e0e0e0;">
      <a href="/" style="padding:10px 24px;text-decoration:none;color:#111;font-weight:600;border-bottom:3px solid #111;margin-bottom:-2px;">统计监控</a>
      <a href="/batches" style="padding:10px 24px;text-decoration:none;color:#666;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;">批次管理</a>
      <a href="/salary" style="padding:10px 24px;text-decoration:none;color:#666;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;">薪资计算</a>
    </div>

    <!-- 控制面板 -->
    <section class="panel controls">
      <div class="ranges" id="rangeBtns">
        <button data-range="1d">最近1天</button>
        <button data-range="3d">最近3天</button>
        <button data-range="1w" class="active">最近1周</button>
        <button data-range="15d">最近15天</button>
        <button data-range="1m">最近1月</button>
      </div>
      <div class="custom">
        <input type="date" id="startDate" />
        <span>至</span>
        <input type="date" id="endDate" />
        <button id="applyCustom">查询</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="按标注员名称搜索..." />
      </div>
      <div class="actions">
        <button id="backfillBtn" class="btn-secondary">回填历史数据</button>
        <button id="exportBtn" class="btn-secondary">导出CSV</button>
        <button id="refreshBtn" class="btn-secondary">刷新数据</button>
      </div>
    </section>

    <!-- 图例 -->
    <section class="legend">
      <span class="legend-item"><i class="dot-red"></i>日均&lt;3h 预警</span>
      <span class="legend-item"><i class="dot-blue"></i>3-5h 正常</span>
      <span class="legend-item"><i class="dot-green"></i>&gt;5h 活跃</span>
    </section>

    <!-- 汇总表 -->
    <section class="panel">
      <div class="panel-head">
        <h2>标注员汇总 <span id="rangeLabel" class="muted"></span></h2>
        <span id="totalCount" class="muted"></span>
      </div>
      <div id="summaryContainer">
        <p class="empty">加载中...</p>
      </div>
    </section>
  </main>

  <!-- 明细弹窗 -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-head">
        <h2 id="detailTitle">每日明细</h2>
        <button class="close" id="closeModal">&times;</button>
      </div>
      <div class="modal-meta" id="detailMeta"></div>
      <div class="table-wrap">
        <table id="detailTable">
          <thead>
            <tr>
              <th>日期</th>
              <th>原始时长(h)</th>
              <th>新任务(h)</th>
              <th>片段时长(h)</th>
              <th>无片段(h)</th>
              <th>无片段等效(h)</th>
              <th>结算参考(h)</th>
              <th>PASS占比</th>
              <th>区间累计(h)</th>
            </tr>
          </thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 回填弹窗 -->
  <div class="modal" id="backfillModal">
    <div class="modal-content" style="max-width: 480px;">
      <div class="modal-head">
        <h2>回填历史数据</h2>
        <button class="close" id="closeBackfill">&times;</button>
      </div>
      <div style="padding: 16px 0;">
        <p style="margin-bottom: 12px; color: #666;">输入需要回填的日期范围，系统将逐日采集历史数据。</p>
        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px;">
          <input type="date" id="backfillStart" style="flex: 1; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px;" />
          <span>至</span>
          <input type="date" id="backfillEnd" style="flex: 1; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px;" />
        </div>
        <p style="margin-bottom: 12px; color: #999; font-size: 12px;">提示：每次最多回填7天，避免超时。如需更多请分多次执行。</p>
        <button id="doBackfill" style="width: 100%; padding: 10px; background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer;">开始回填</button>
        <div id="backfillResult" style="margin-top: 12px; font-size: 13px; color: #666;"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <span id="footStatus"></span>
  </footer>

  <script src="app.js?v=20260814"></script>
</body>
</html>

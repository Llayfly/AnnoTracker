# Nginx 反向代理配置
# 用法：将本文件复制到 /etc/nginx/sites-available/annotator-monitor
# 然后建立软链：ln -s /etc/nginx/sites-available/annotator-monitor /etc/nginx/sites-enabled/
# 将 your-domain.com 替换为你的实际域名
# SSL 证书通过 Let's Encrypt 获取后，nginx 会被 certbot 自动修改为 HTTPS

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Let's Encrypt 证书验证用
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 反向代理到 Node.js 服务
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 10m;
}
